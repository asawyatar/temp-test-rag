# Render Blueprint: the API and its Postgres, in one region.
# Render -> New -> Blueprint -> pick this repo. Steps: docs/DEPLOY.md.

services:
  - type: web
    name: atar-ai-agent
    runtime: python
    # Closest Render region to Saudi Arabia.
    region: frankfurt
    # Paid: free instances sleep when idle and cannot run preDeployCommand.
    plan: starter
    branch: main
    # uv installs exactly what uv.lock pins, without the dev and bakeoff
    # groups (no torch). Python comes from .python-version.
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Runs before each new version goes live; a failed migration stops the deploy.
    preDeployCommand: .venv/bin/atar-migrate
    # One worker: concurrency comes from async (see api/app.py).
    startCommand: .venv/bin/uvicorn atar_ai_agent.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    # Answers 503 until the database connects, so traffic waits for it.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atar-ai-db
          property: connectionString
      # sync: false -> Render asks for the value when the Blueprint is created;
      # it never lives in the repo.
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_BASE_URL
        sync: false
      # Ingestion runs from a laptop, never on the server: no browser here.
      - key: RENDER_BROWSER
        value: "off"
      # DEV_AUTH is deliberately absent: it trusts any X-Tenant-Id header.

databases:
  - name: atar-ai-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: atar_ai
    user: atar
